<!doctype html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1521" />
    <title>Mācību konspekti</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0b1521;
        --surface: #111f2f;
        --text: #edf3f6;
        --muted: #a9bbc9;
        --line: #2c4051;
        --accent: #9bdcc0;
        --error: #ffb2ba;
      }

      *, *::before, *::after { box-sizing: border-box; }
      [hidden] { display: none !important; }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: var(--background);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .site-header, main {
        width: min(1120px, calc(100% - 64px));
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 82px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
        font-weight: 650;
        letter-spacing: .01em;
      }

      .site-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid #446758;
        border-radius: 7px;
        color: var(--accent);
        background: #142b2a;
      }

      .site-mark svg, .choice-icon svg { width: 20px; height: 20px; }

      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: clamp(36px, 8vw, 115px);
        margin-block: clamp(46px, 9vh, 100px) 56px;
      }

      main:has(#menu:not([hidden])) { display: block; }
      main:has(#menu:not([hidden])) .portal-art { display: none; }
      #login { max-width: 430px; }
      #menu { max-width: 860px; }
      .portal-content section:not([hidden]) { animation: appear 220ms ease-out both; }

      h1 {
        margin: 0 0 28px;
        font-size: clamp(34px, 5vw, 55px);
        font-weight: 710;
        line-height: 1.08;
        letter-spacing: -.048em;
      }

      #menu-title { margin-bottom: 28px; font-size: clamp(31px, 4.4vw, 48px); }
      #menu-title:focus { outline: none; }
      .greeting { margin: 0 0 8px; color: var(--accent); font-size: 14px; font-weight: 620; }
      label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
      input, button { font: inherit; }
      :is(input, button, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

      input {
        display: block;
        width: 100%;
        min-height: 51px;
        padding: 11px 14px;
        border: 1px solid #3b5366;
        border-radius: 7px;
        color: var(--text);
        background: var(--surface);
      }

      input:hover { border-color: #71928e; }
      input[aria-invalid="true"] { border-color: var(--error); }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: .6; }

      .submit {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 51px;
        margin-top: 12px;
        padding: 11px 16px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: var(--accent);
        color: #102c25;
        font-weight: 690;
        transition: background-color 150ms ease;
      }

      .submit:hover:not(:disabled) { background: #b6ebd5; }
      .submit::after, .choice::after {
        width: 8px;
        height: 8px;
        margin-right: 4px;
        border: solid currentColor;
        border-width: 1.5px 1.5px 0 0;
        content: "";
        transform: rotate(45deg);
      }

      .status { margin: 12px 0 0; color: var(--error); font-size: 14px; }
      .choices { display: grid; border-top: 1px solid var(--line); }
      .choice {
        display: grid;
        grid-template-columns: 23px minmax(0, 1fr) 14px;
        align-items: center;
        gap: 16px;
        width: 100%;
        min-height: 66px;
        padding: 12px 8px 12px 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        background: transparent;
        text-align: left;
        text-decoration: none;
        line-height: 1.32;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .choice-icon { display: grid; place-items: center; color: var(--accent); }
      .choice::after { color: var(--accent); }
      .choice strong, .choice small { display: block; }
      .choice strong { font-size: 16px; font-weight: 630; }
      .choice small { margin-top: 4px; color: var(--muted); font-size: 13px; }
      .choice:hover { color: var(--accent); background: var(--surface); }
      .change-name {
        min-height: 44px;
        margin-top: 16px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .change-name:hover { color: var(--accent); }

      .portal-art {
        display: grid;
        place-items: center;
        min-width: 0;
        background: radial-gradient(ellipse at center, #152e43, transparent 70%);
      }

      .portal-art > svg { display: block; width: min(100%, 480px); height: auto; }
      @keyframes appear {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 760px) {
        .site-header, main { width: calc(100% - 36px); }
        .site-header { min-height: 65px; }
        main { grid-template-columns: 1fr; gap: 20px; margin-block: 35px; }
        #login { max-width: none; }
        .portal-art { height: 147px; overflow: hidden; }
        .portal-art > svg { width: 185px; }
        h1 { margin-bottom: 22px; }
        .choice { gap: 12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="site-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a8 8 0 0 0-8-2v14a8 8 0 0 1 8 2 8 8 0 0 1 8-2V4a8 8 0 0 0-8 2Zm0 0v14"/></svg></span>
      <span>Mācību konspekti</span>
    </header>
    <main>
      <div class="portal-content">
      <section id="login" aria-labelledby="login-title">
        <h1 id="login-title">kā tevi sauc?</h1>
        <form id="name-form">
          <label for="name">Tavs vārds</label>
          <input
            id="name"
            name="name"
            type="password"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            maxlength="80"
            aria-describedby="login-message"
            required
          />
          <button id="submit" class="submit" type="submit" disabled>
            Turpināt
          </button>
          <p
            id="login-message"
            class="status"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </form>
        <noscript
          ><p class="status">
            Lai atvērtu konspektus, pārlūkā jāieslēdz JavaScript.
          </p></noscript
        >
      </section>

      <section id="menu" aria-labelledby="menu-title" hidden>
        <p id="greeting" class="greeting"></p>
        <h1 id="menu-title" tabindex="-1">Izvēlies konspektu</h1>
        <div class="choices">
          <button id="project" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/></svg></span>
            <span><strong>Projektu vadība</strong>
            <small>Tēmas 2., 3., 3.2</small></span>
          </button>
          <button id="sales" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M8 15l4-5 4 2 4-6"/></svg></span>
            <span><strong>Preču realizācijas vadība (1.KD)</strong></span>
          </button>
          <button id="pums" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg></span>
            <span><strong>PUMS prezentācija</strong>
            <small>Nike un Adidas salīdzinājums</small></span>
          </button>
          <a class="choice" href="riska_vadiba.html">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 4.8 3.4 17.6A1.6 1.6 0 0 0 4.8 20h14.4a1.6 1.6 0 0 0 1.4-2.4L13.3 4.8a1.5 1.5 0 0 0-2.6 0ZM12 10v3.5m0 3h.01"/></svg></span>
            <span><strong>Risku vadība</strong><small>Eksāmena konspekts</small></span>
          </a>
          <a class="choice" href="padzilinata-risku-analize-un-vadiba.html">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.2 15.2 4.5 4.5M7 12h2l1.5-3 1.5 3H14"/></svg></span>
            <span><strong>Padziļināta risku analīze un vadība</strong><small>Detalizēts konspekts</small></span>
          </a>
        </div>
        <p
          id="menu-message"
          class="status"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <button id="change-name" class="change-name" type="button">
          Mainīt vārdu / iziet
        </button>
      </section>
      </div>
      <div class="portal-art" aria-hidden="true">
        <svg viewBox="0 0 460 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="paper-surface" x1="106" y1="86" x2="349" y2="310" gradientUnits="userSpaceOnUse">
              <stop stop-color="#507B92"/><stop offset="1" stop-color="#244859"/>
            </linearGradient>
            <linearGradient id="paper-edge" x1="111" y1="84" x2="344" y2="296" gradientUnits="userSpaceOnUse">
              <stop stop-color="#A5D5C1"/><stop offset="1" stop-color="#537984"/>
            </linearGradient>
          </defs>
          <circle cx="231" cy="201" r="169" stroke="#83B8BA" stroke-opacity=".24"/>
          <circle cx="231" cy="201" r="135" stroke="#83B8BA" stroke-opacity=".25"/>
          <path d="M43 201h376M231 13v376" stroke="#8BAAB7" stroke-opacity=".14" stroke-dasharray="4 6"/>
          <circle cx="231" cy="32" r="4" fill="#A4E1C7"/>
          <circle cx="399" cy="201" r="4" fill="#9BDCC0"/>
          <circle cx="62" cy="201" r="3" fill="#83B8BA"/>
          <g>
            <rect x="143" y="120" width="198" height="189" rx="18" transform="rotate(12 143 120)" fill="#243B50" stroke="#7392A7" stroke-opacity=".58"/>
            <rect x="96" y="123" width="198" height="189" rx="18" transform="rotate(-12 96 123)" fill="#244658" stroke="#76A6B0" stroke-opacity=".62"/>
            <rect x="131" y="94" width="200" height="213" rx="20" fill="url(#paper-surface)" stroke="url(#paper-edge)" stroke-width="1.5"/>
            <rect x="156" y="120" width="52" height="52" rx="12" fill="#D2EEE1" fill-opacity=".19" stroke="#C6E6D9" stroke-opacity=".35"/>
            <path d="M182 137a10 10 0 0 0-9-2v19a10 10 0 0 1 9 2 10 10 0 0 1 9-2v-19a10 10 0 0 0-9 2Zm0 0v19" stroke="#E9F5EF" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M157 202h113" stroke="#E9F5EF" stroke-opacity=".89" stroke-width="5" stroke-linecap="round"/>
            <path d="M157 222h145m-145 15h123m-123 15h141m-141 15h88" stroke="#C0DED5" stroke-opacity=".47" stroke-width="3" stroke-linecap="round"/>
            <path d="M296 127v23l-8-5-8 5v-23" stroke="#E9F5EF" stroke-opacity=".82" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <path d="M354 71v16m-8-8h16M101 311v16m-8-8h16" stroke="#A4C6BD" stroke-opacity=".67" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
    </main>

    <script>
      (() => {
        "use strict";

        const AUTH_KEY = "macibas.auth.v1";
        const ENTRY_KEY = "macibas.entry.v1";
        const NAMES = { toms: "Toms", arta: "Arta", gabriela: "Gabriēla" };
        const $ = (id) => document.getElementById(id);
        const normalize = (value) =>
          value
            .trim()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();
        const token = () =>
          Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte) =>
            byte.toString(16).padStart(2, "0"),
          ).join("");

        function message(id, text) {
          $(id).textContent = text;
          $(id).hidden = !text;
        }

        function clearSession() {
          sessionStorage.removeItem(AUTH_KEY);
          sessionStorage.removeItem(ENTRY_KEY);
        }

        function readAuth() {
          try {
            const auth = JSON.parse(sessionStorage.getItem(AUTH_KEY) || "null");
            return auth &&
              typeof auth.id === "string" &&
              auth.id.length === 32 &&
              Object.values(NAMES).includes(auth.name)
              ? auth
              : null;
          } catch {
            return null;
          }
        }

        function showLogin(text = "") {
          $("menu").hidden = true;
          $("login").hidden = false;
          $("name").value = "";
          $("name").removeAttribute("aria-invalid");
          message("login-message", text);
          message("menu-message", "");
        }

        function showMenu(auth, focus = false) {
          $("greeting").textContent = `Sveiki, ${auth.name}!`;
          $("login").hidden = true;
          $("menu").hidden = false;
          message("menu-message", "");
          if (focus) $("menu-title").focus();
        }

        function initialize() {
          // HTTP(S) vajadzīgs, lai abiem failiem būtu kopīga pārlūka sesija.
          if (!["http:", "https:"].includes(location.protocol)) {
            showLogin(
              "Atver lapu caur VS Code Live Server vai vietnes adresi (HTTP/HTTPS), nevis ar dubultklikšķi uz faila.",
            );
            $("submit").disabled = true;
            return;
          }
          try {
            const testKey = "macibas.storage-test";
            sessionStorage.setItem(testKey, "1");
            sessionStorage.removeItem(testKey);
            const url = new URL(location.href);
            const loginRequired = url.searchParams.get("login") === "required";
            if (loginRequired) {
              clearSession();
              url.searchParams.delete("login");
              history.replaceState(history.state, "", url.href);
            }
            $("submit").disabled = false;
            const auth = readAuth();
            if (auth) showMenu(auth);
            else showLogin(loginRequired ? "Vispirms ievadi savu vārdu." : "");
          } catch {
            showLogin(
              "Pārlūks bloķē sesijas saglabāšanu. Atļauj šai vietnei izmantot pārlūka krātuvi un pārlādē lapu.",
            );
            $("submit").disabled = true;
          }
        }

        $("name-form").addEventListener("submit", (event) => {
          event.preventDefault();
          if ($("submit").disabled) return;
          const key = normalize($("name").value);
          if (!Object.hasOwn(NAMES, key)) {
            $("name").setAttribute("aria-invalid", "true");
            message(
              "login-message",
              "Šim vārdam piekļuve nav piešķirta. Pārbaudi ievadīto vārdu.",
            );
            return;
          }
          try {
            clearSession();
            const auth = { name: NAMES[key], id: token() };
            sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth));
            $("name").value = "";
            showMenu(auth, true);
          } catch {
            message(
              "login-message",
              "Neizdevās saglabāt sesiju. Pārbaudi pārlūka krātuves atļaujas.",
            );
          }
        });

        $("name").addEventListener("input", () => {
          $("name").removeAttribute("aria-invalid");
          if (!$("submit").disabled) message("login-message", "");
        });

        function openMaterial(file) {
          const auth = readAuth();
          if (!auth) {
            showLogin("Sesija ir beigusies. Ievadi vārdu vēlreiz.");
            return;
          }
          try {
            const url = new URL(file, location.href);
            const entryToken = token();
            sessionStorage.setItem(
              ENTRY_KEY,
              JSON.stringify({
                token: entryToken,
                session: auth.id,
                path: url.pathname,
                expires: Date.now() + 120000,
              }),
            );
            url.searchParams.set("entry", entryToken);
            location.assign(url.href); // Atver tajā pašā cilnē.
          } catch {
            message(
              "menu-message",
              "Konspektu neizdevās atvērt. Pamēģini ievadīt vārdu vēlreiz.",
            );
          }
        }

        $("project").addEventListener("click", () => openMaterial("projektu-vadiba-konspekts.html"));
        $("sales").addEventListener("click", () => openMaterial("precu-realizacijas-vadiba.html"));
        $("pums").addEventListener("click", () => openMaterial("PUMS-prezentacija.html"));

        $("change-name").addEventListener("click", () => {
          try {
            clearSession();
          } catch {}
          showLogin();
          $("name").focus();
        });

        // Atjauno sākumlapu, atgriežoties ar pārlūka pogu Atpakaļ.
        window.addEventListener("pageshow", (event) => {
          if (event.persisted) initialize();
        });

        // Sākumlapas sākotnējā palaišana.
        initialize();
      })();
    </script>
  </body>
</html>
