<!doctype html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1020" />
    <title>Mācību konspekti</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0a1020;
        --panel: #101a30;
        --text: #f1f5ff;
        --muted: #aebbd7;
        --line: #283756;
        --accent: #91aaff;
        --error: #ffb0b9;
      }

      *, *::before, *::after { box-sizing: border-box; }
      [hidden] { display: none !important; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(ellipse at 84% 5%, #1d2c62 0, transparent 45%),
          radial-gradient(ellipse at 8% 90%, #12244c 0, transparent 46%),
          var(--background);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .site-header, main {
        width: min(1120px, calc(100% - 64px));
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 91px;
        border-bottom: 1px solid #adc4ff24;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: .01em;
      }

      .site-mark {
        display: grid;
        width: 37px;
        height: 37px;
        place-items: center;
        border: 1px solid #a0b9ff49;
        border-radius: 12px;
        background: #506bc92e;
        color: #dbe5ff;
      }

      .site-mark svg, .choice-icon svg { width: 20px; height: 20px; }

      main {
        display: grid;
        grid-template-columns: 1.08fr 1fr;
        min-height: 494px;
        margin-block: clamp(42px, 8.5vh, 108px) 56px;
        overflow: hidden;
        border: 1px solid #a4bbff35;
        border-radius: 29px;
        background: var(--panel);
        box-shadow: 0 30px 85px #03071280;
      }

      .portal-content {
        display: grid;
        align-items: center;
        padding: clamp(30px, 4.5vw, 66px);
      }

      .portal-content section:not([hidden]) { animation: appear 300ms ease-out both; }

      h1 {
        margin: 0 0 28px;
        font-size: clamp(35px, 4.3vw, 54px);
        font-weight: 730;
        line-height: 1.05;
        letter-spacing: -.055em;
        text-wrap: balance;
      }

      #menu-title { margin-bottom: 25px; font-size: clamp(31px, 3.7vw, 46px); }
      .greeting { margin: 0 0 9px; color: #a9bcff; font-size: 14px; font-weight: 650; }
      label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
      input, button { font: inherit; }

      input, button {
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        transition: border-color 160ms ease, background-color 160ms ease,
          box-shadow 160ms ease, transform 160ms ease;
      }

      input {
        display: block;
        width: 100%;
        min-height: 53px;
        padding: 12px 15px;
        background: #0a1327;
      }

      input:hover { border-color: #526caa; }
      input[aria-invalid="true"] { border-color: var(--error); }
      :is(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      #menu-title:focus { outline: none; }
      button { min-height: 44px; cursor: pointer; background: #14223d; }
      button:disabled { cursor: default; opacity: .6; }

      .submit {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        min-height: 53px;
        margin-top: 13px;
        padding: 12px 16px;
        border-color: #7291ff77;
        color: white;
        background: linear-gradient(105deg, #3155d9, #4e46cb);
        box-shadow: 0 8px 21px #08143685;
        font-weight: 670;
        text-align: left;
      }

      .submit::after, .choice::after { content: ""; width: 8px; height: 8px; border: solid currentColor; border-width: 1.5px 1.5px 0 0; transform: rotate(45deg); margin-right: 4px; }
      .submit:hover:not(:disabled) { border-color: #c1d0ff; box-shadow: 0 8px 26px #476aff65; transform: translateY(-1px); }
      .status { margin: 12px 0 0; color: var(--error); font-size: 14px; }

      .choices { display: grid; gap: 9px; }
      .choice {
        --choice-color: #a8bcff;
        display: grid;
        grid-template-columns: 42px 1fr 14px;
        align-items: center;
        gap: 13px;
        width: 100%;
        min-height: 65px;
        padding: 10px 13px;
        text-align: left;
        line-height: 1.28;
      }

      #sales { --choice-color: #92e1db; }
      #pums { --choice-color: #c7b3ff; }
      .choice-icon {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 10px;
        color: var(--choice-color);
        background: color-mix(in srgb, var(--choice-color) 13%, transparent);
      }

      .choice::after { color: var(--choice-color); }
      .choice strong, .choice small { display: block; }
      .choice strong { font-size: 15px; font-weight: 650; }
      .choice small { margin-top: 4px; color: var(--muted); font-size: 12px; }
      .choice:hover { transform: translateY(-1px); border-color: #637fca; background: #1a2d53; }
      .submit:active:not(:disabled), .choice:active { transform: translateY(1px); }
      .change-name {
        display: block;
        width: fit-content;
        margin-top: 13px;
        padding: 0 3px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .change-name:hover { color: var(--text); }

      .portal-art {
        position: relative;
        display: grid;
        place-items: center;
        isolation: isolate;
        overflow: hidden;
        border-left: 1px solid #b7caff2b;
        background:
          radial-gradient(ellipse at 63% 33%, #3f5bb8 0, transparent 59%),
          radial-gradient(ellipse at 91% 81%, #343278 0, transparent 53%),
          #131f3e;
      }

      .portal-art::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        content: "";
        background-image: linear-gradient(#b7ccff16 1px, transparent 1px),
          linear-gradient(90deg, #b7ccff16 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse at center, #000, transparent 75%);
      }

      .portal-art > svg { width: 94%; max-width: 490px; height: auto; overflow: visible; }
      .art-sheet { animation: drift 9s ease-in-out infinite alternate; }

      @keyframes appear {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes drift {
        from { transform: translateY(-3px); }
        to { transform: translateY(7px); }
      }

      @media (max-width: 760px) {
        .site-header, main { width: calc(100% - 36px); }
        .site-header { min-height: 67px; }
        main { grid-template-columns: 1fr; min-height: 0; margin-block: 26px 35px; border-radius: 21px; }
        .portal-content { padding: 32px 24px; }
        .portal-art { grid-row: 1; height: clamp(114px, 28vw, 160px); border-left: 0; border-bottom: 1px solid #b7caff2b; }
        .portal-art > svg { position: absolute; width: 210px; max-width: 70%; }
        h1 { margin-bottom: 22px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="site-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a8 8 0 0 0-8-2v14a8 8 0 0 1 8 2 8 8 0 0 1 8-2V4a8 8 0 0 0-8 2Zm0 0v14"/></svg></span>
      <span>Mācību konspekti</span>
    </header>
    <main>
      <div class="portal-content">
      <section id="login" aria-labelledby="login-title">
        <h1 id="login-title">kā tevi sauc?</h1>
        <form id="name-form">
          <label for="name">Tavs vārds</label>
          <input
            id="name"
            name="name"
            type="password"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            maxlength="80"
            aria-describedby="login-message"
            required
          />
          <button id="submit" class="submit" type="submit" disabled>
            Turpināt
          </button>
          <p
            id="login-message"
            class="status"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </form>
        <noscript
          ><p class="status">
            Lai atvērtu konspektus, pārlūkā jāieslēdz JavaScript.
          </p></noscript
        >
      </section>

      <section id="menu" aria-labelledby="menu-title" hidden>
        <p id="greeting" class="greeting"></p>
        <h1 id="menu-title" tabindex="-1">Izvēlies konspektu</h1>
        <div class="choices">
          <button id="project" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/></svg></span>
            <span><strong>Projektu vadība</strong>
            <small>Tēmas 2., 3., 3.2</small></span>
          </button>
          <button id="sales" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M8 15l4-5 4 2 4-6"/></svg></span>
            <span><strong>Preču realizācijas vadība (1.KD)</strong></span>
          </button>
          <button id="pums" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg></span>
            <span><strong>PUMS prezentācija</strong>
            <small>Nike un Adidas salīdzinājums</small></span>
          </button>
        </div>
        <p
          id="menu-message"
          class="status"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <button id="change-name" class="change-name" type="button">
          Mainīt vārdu / iziet
        </button>
      </section>
      </div>
      <div class="portal-art" aria-hidden="true">
        <svg viewBox="0 0 460 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="paper-surface" x1="106" y1="86" x2="349" y2="310" gradientUnits="userSpaceOnUse">
              <stop stop-color="#809CFF"/><stop offset="1" stop-color="#363C98"/>
            </linearGradient>
            <linearGradient id="paper-edge" x1="111" y1="84" x2="344" y2="296" gradientUnits="userSpaceOnUse">
              <stop stop-color="#C2D2FF"/><stop offset="1" stop-color="#6D7BD1"/>
            </linearGradient>
          </defs>
          <circle cx="231" cy="201" r="169" stroke="#AFC4FF" stroke-opacity=".24"/>
          <circle cx="231" cy="201" r="135" stroke="#AFC4FF" stroke-opacity=".25"/>
          <path d="M43 201h376M231 13v376" stroke="#BFD0FF" stroke-opacity=".14" stroke-dasharray="4 6"/>
          <circle cx="231" cy="32" r="4" fill="#A9E6ED"/>
          <circle cx="399" cy="201" r="4" fill="#C6BCFF"/>
          <circle cx="62" cy="201" r="3" fill="#A7BFFF"/>
          <g class="art-sheet">
            <rect x="143" y="120" width="198" height="189" rx="18" transform="rotate(12 143 120)" fill="#363C83" stroke="#AAB5FF" stroke-opacity=".58"/>
            <rect x="96" y="123" width="198" height="189" rx="18" transform="rotate(-12 96 123)" fill="#355384" stroke="#A6D1FF" stroke-opacity=".62"/>
            <rect x="131" y="94" width="200" height="213" rx="20" fill="url(#paper-surface)" stroke="url(#paper-edge)" stroke-width="1.5"/>
            <rect x="156" y="120" width="52" height="52" rx="12" fill="#DCE6FF" fill-opacity=".19" stroke="#EAF2FF" stroke-opacity=".35"/>
            <path d="M182 137a10 10 0 0 0-9-2v19a10 10 0 0 1 9 2 10 10 0 0 1 9-2v-19a10 10 0 0 0-9 2Zm0 0v19" stroke="#F3F7FF" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M157 202h113" stroke="#F3F7FF" stroke-opacity=".89" stroke-width="5" stroke-linecap="round"/>
            <path d="M157 222h145m-145 15h123m-123 15h141m-141 15h88" stroke="#E0E8FF" stroke-opacity=".47" stroke-width="3" stroke-linecap="round"/>
            <path d="M296 127v23l-8-5-8 5v-23" stroke="#F3F7FF" stroke-opacity=".82" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <path d="M354 71v16m-8-8h16M101 311v16m-8-8h16" stroke="#D0DCFF" stroke-opacity=".67" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
    </main>

    <script>
      (() => {
        "use strict";

        const AUTH_KEY = "macibas.auth.v1";
        const ENTRY_KEY = "macibas.entry.v1";
        const NAMES = { toms: "Toms", arta: "Arta", gabriela: "Gabriēla" };
        const $ = (id) => document.getElementById(id);
        const normalize = (value) =>
          value
            .trim()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();
        const token = () =>
          Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte) =>
            byte.toString(16).padStart(2, "0"),
          ).join("");

        function message(id, text) {
          $(id).textContent = text;
          $(id).hidden = !text;
        }

        function clearSession() {
          sessionStorage.removeItem(AUTH_KEY);
          sessionStorage.removeItem(ENTRY_KEY);
        }

        function readAuth() {
          try {
            const auth = JSON.parse(sessionStorage.getItem(AUTH_KEY) || "null");
            return auth &&
              typeof auth.id === "string" &&
              auth.id.length === 32 &&
              Object.values(NAMES).includes(auth.name)
              ? auth
              : null;
          } catch {
            return null;
          }
        }

        function showLogin(text = "") {
          $("menu").hidden = true;
          $("login").hidden = false;
          $("name").value = "";
          $("name").removeAttribute("aria-invalid");
          message("login-message", text);
          message("menu-message", "");
        }

        function showMenu(auth, focus = false) {
          $("greeting").textContent = `Sveiki, ${auth.name}!`;
          $("login").hidden = true;
          $("menu").hidden = false;
          message("menu-message", "");
          if (focus) $("menu-title").focus();
        }

        function initialize() {
          // HTTP(S) vajadzīgs, lai abiem failiem būtu kopīga pārlūka sesija.
          if (!["http:", "https:"].includes(location.protocol)) {
            showLogin(
              "Atver lapu caur VS Code Live Server vai vietnes adresi (HTTP/HTTPS), nevis ar dubultklikšķi uz faila.",
            );
            $("submit").disabled = true;
            return;
          }
          try {
            const testKey = "macibas.storage-test";
            sessionStorage.setItem(testKey, "1");
            sessionStorage.removeItem(testKey);
            const url = new URL(location.href);
            const loginRequired = url.searchParams.get("login") === "required";
            if (loginRequired) {
              clearSession();
              url.searchParams.delete("login");
              history.replaceState(history.state, "", url.href);
            }
            $("submit").disabled = false;
            const auth = readAuth();
            if (auth) showMenu(auth);
            else showLogin(loginRequired ? "Vispirms ievadi savu vārdu." : "");
          } catch {
            showLogin(
              "Pārlūks bloķē sesijas saglabāšanu. Atļauj šai vietnei izmantot pārlūka krātuvi un pārlādē lapu.",
            );
            $("submit").disabled = true;
          }
        }

        $("name-form").addEventListener("submit", (event) => {
          event.preventDefault();
          if ($("submit").disabled) return;
          const key = normalize($("name").value);
          if (!Object.hasOwn(NAMES, key)) {
            $("name").setAttribute("aria-invalid", "true");
            message(
              "login-message",
              "Šim vārdam piekļuve nav piešķirta. Pārbaudi ievadīto vārdu.",
            );
            return;
          }
          try {
            clearSession();
            const auth = { name: NAMES[key], id: token() };
            sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth));
            $("name").value = "";
            showMenu(auth, true);
          } catch {
            message(
              "login-message",
              "Neizdevās saglabāt sesiju. Pārbaudi pārlūka krātuves atļaujas.",
            );
          }
        });

        $("name").addEventListener("input", () => {
          $("name").removeAttribute("aria-invalid");
          if (!$("submit").disabled) message("login-message", "");
        });

        function openMaterial(file) {
          const auth = readAuth();
          if (!auth) {
            showLogin("Sesija ir beigusies. Ievadi vārdu vēlreiz.");
            return;
          }
          try {
            const url = new URL(file, location.href);
            const entryToken = token();
            sessionStorage.setItem(
              ENTRY_KEY,
              JSON.stringify({
                token: entryToken,
                session: auth.id,
                path: url.pathname,
                expires: Date.now() + 120000,
              }),
            );
            url.searchParams.set("entry", entryToken);
            location.assign(url.href); // Atver tajā pašā cilnē.
          } catch {
            message(
              "menu-message",
              "Konspektu neizdevās atvērt. Pamēģini ievadīt vārdu vēlreiz.",
            );
          }
        }

        $("project").addEventListener("click", () => openMaterial("projektu-vadiba-konspekts.html"));
        $("sales").addEventListener("click", () => openMaterial("precu-realizacijas-vadiba.html"));
        $("pums").addEventListener("click", () => openMaterial("PUMS-prezentacija.html"));

        $("change-name").addEventListener("click", () => {
          try {
            clearSession();
          } catch {}
          showLogin();
          $("name").focus();
        });

        // Atjauno sākumlapu, atgriežoties ar pārlūka pogu Atpakaļ.
        window.addEventListener("pageshow", (event) => {
          if (event.persisted) initialize();
        });

        // Sākumlapas sākotnējā palaišana.
        initialize();
      })();
    </script>
  </body>
</html>
